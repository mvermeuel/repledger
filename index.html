t)}" onchange="edit(${i},'unit',this.value)"></label><label>Tester set<select onchange="edit(${i},'tester',this.value)"><option value="-1">None</option>${e.sets.map((s,j)=>s.warm?'':`<option value="${j}" ${j===e.tester?'selected':''}>Set ${j+1}</option>`).join('')}</select></label></div><div class="set"><small>Set</small><small>Weight</small><small>Reps</small><small>Warm-up</small><span></span></div>${e.sets.map((s,j)=>`<div class="set"><span>${j+1}</span><input aria-label="Weight" type="number" min="0" step="any" value="${s.w}" onchange="editSet(${i},${j},'w',this.value)"><input aria-label="Reps" type="number" min="1" value="${s.r}" onchange="editSet(${i},${j},'r',this.value)"><input aria-label="Warm-up" type="checkbox" ${s.warm?'checked':''} onchange="editSet(${i},${j},'warm',this.checked)"><button class="alt" onclick="mutate(${i},'setremove',${j})">×</button></div>`).join('')}<button class="alt" onclick="mutate(${i},'setadd')">Add set</button></section>`).join('')+`<button class="wide" onclick="mutate(0,'add')">Add exercise</button>`}
function home(){let h=data.history.at(-1),n=nextDay();return `<section><small>${data.drafts[n]?.start?"Active workout":"Recommended next workout"}</small><h2>${data.plan[n][0]}</h2><p>${h?'Last workout: '+esc(h.day)+' · '+new Date(h.date).toLocaleDateString()+' · '+fmt(h.duration):'No completed workouts yet'}</p>${data.plan.map(p=>{let x=data.history.filter(h=>h.day===p[0]).at(-1);return `<p><small>${p[0]}: ${x?new Date(x.date).toLocaleDateString():'Not yet completed'}</small></p>`}).join('')}<button class="wide" onclick="beginWorkout(${n})">${data.drafts[n]?.start?(data.drafts[n]?.pausedAt?'Resume':'Return to'):'Start'} ${data.plan[n][0]}</button>${data.drafts[n]?.start?'<p><small>Finish or discard the active workout to start another day.</small></p>':`<p><b>Choose any workout</b></p><div class="choose-days">${data.plan.map((p,i)=>`<button class="alt" onclick="beginWorkout(${i})">Start ${esc(p[0])}</button>`).join('')}</div>`}</section>`}function previous(e){let x=data.history.slice().reverse().flatMap(h=>h.exercises).find(x=>x.id===e.id);return x?'<p><small>Previous: '+x.sets.filter(s=>s.done).map(s=>s.w+' × '+s.r).join(' / ')+'</small></p>':''}function bodyweight(e){return e.mode==='reps'&&e.sets.every(s=>s.w===0||s.w==='')&&/added lb|bodyweight/i.test(e.unit)}function workout(){return home()+ `<section><b>${count(exercises())} working sets</b><p><small>Enter starting weights on your first visit. Tester: stop at the upper target or earlier if form deteriorates. For unilateral lifts, log reps on the weaker side.</small></p></section>`+exercises().map((e,i)=>{let rs=rows(e),bw=bodyweight(e);if(bw)rs.forEach(r=>{if(r.w==='')r.w=0});return `<section><h3>${i+1}. ${esc(e.name)}</h3>${previous(e)}${e.notes?`<p class="note">${esc(e.notes)}</p>`:''}<div class="line"><button class="alt" onclick="moveLive(${i},-1)">↑</button><button class="alt" onclick="moveLive(${i},1)">↓</button></div><small>${bw?'Bodyweight · Rep progression':esc(e.unit)+(e.mode==='reps'?' · Rep progression':'')} · Rest ${fmt(e.rest)}</small><div class="set live head ${bw?'reps':''}"><small>Set</small>${bw?'':'<small>Weight</small>'}<small>Target</small><small>Actual</small><span></span></div>${`<div id="warm-${e.id}">${warmHTML(e,i)}</div>`}${e.sets.map((s,j)=>`<div class="set live ${bw?'reps':''} ${rs[j].done?'done':''}"><small>${j+1}${s.warm?' Warm':j===e.tester?' Test':''}</small>${bw?'':`<input aria-label="Weight" type="number" min="0" step="any" placeholder="lb" value="${rs[j].w}" onchange="setval(${i},${j},'w',this.value)" ${rs[j].done?'disabled':''}>`}<span>${s.r}${j===e.tester&&!s.warm&&e.mode!=='none'?'–'+(s.r+(e.mode==='reps'?e.repExtra||2:Math.max(e.lo,e.hi))):''}</span><input aria-label="Actual reps" type="number" min="0" value="${rs[j].r}" onchange="setval(${i},${j},'r',this.value)" ${rs[j].done?'disabled':''}><button onclick="log(${i},${j})">${rs[j].done?'✓':'Log'}</button></div>`).join('')}<small>${rs.every((r,j)=>e.sets[j].warm||r.done)?'Next session: '+(progression(e,rs)?'+'+progression(e,rs)+(e.mode==='reps'?' reps':' lb'):'maintain'):e.mode==='reps'?'Earn +'+(e.repStep||1)+' rep per set with '+(e.repExtra||2)+' extra tester reps and all other targets.':'Progression calculated after all working sets.'}</small></section>`}).join('')+`<button class="wide" onclick="finish()">Finish & save workout</button>`}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('repledger-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data),'application/json')}function csv(){let q=x=>'"'+String(x).replaceAll('"','""')+'"';download('repledger-history.csv','Date,Day,Duration_seconds,Exercise,Set,Weight,Reps,Target,Warmup,Tester,Logged,Increase,Next_weight,Progression_mode,Next_reps\n'+data.history.flatMap(h=>h.exercises.flatMap(e=>e.sets.map((s,j)=>[h.date,h.day,h.duration,e.name,j+1,s.w,s.r,s.target,s.warm,s.tester,s.done,e.delta,s.nextWeight??'',e.mode||'weight',s.nextReps??''].map(q).join(',')))).join('\n'),'text/csv')}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if((x.schemaVersion||1)>6||!Array.isArray(x.plan)||x.plan.length!==3||!Array.isArray(x.history)||!x.drafts||!x.plan.every(p=>Array.isArray(p[1])&&p[1].every(e=>Array.isArray(e.sets)&&e.id&&typeof e.name==='string'&&e.sets.every(s=>Number.isInteger(s.r)&&s.r>0&&(s.w===''||Number.isFinite(s.w))))))throw Error();if(!x.history.every(h=>Array.isArray(h.exercises)&&h.exercises.every(e=>Array.isArray(e.sets))))throw Error();if(confirm('Replace current program and history? Export your current backup first if needed.')){data=x;migrate();day=nextDay();save();render()}}catch{alert('Invalid RepLedger backup.')}}let chartExercise=0;function chart(points,label){if(!points.length)return '<p><small>No data yet.</small></p>';let ys=points.map(p=>p.y),lo=Math.min(...ys),hi=Math.max(...ys);if(lo===hi){lo-=1;hi+=1}let coords=points.map((p,i)=>[40+(points.length===1?130:i*260/(points.length-1)),105-(p.y-lo)/(hi-lo)*80]);return `<svg viewBox="0 0 340 130" style="width:100%;max-height:180px" role="img" aria-label="${esc(label)}"><text x="2" y="20" font-size="10">${hi.toFixed(1)}</text><text x="2" y="110" font-size="10">${lo.toFixed(1)}</text><path d="M40 15 V105 H300" fill="none" stroke="#bbb"/><polyline points="${coords.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3270a5" stroke-width="2"/>${coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#3270a5"><title>${esc(points[i].label)}</title></circle>`).join('')}<text x="40" y="125" font-size="10">Session 1</text><text x="300" y="125" text-anchor="end" font-size="10">${points.length}</text></svg>`}function trends(){let hs=data.history.filter(h=>h.day===data.plan[day][0]),es=exercises(),e=es[chartExercise]||es[0];let ps=e?hs.flatMap(h=>{let x=h.exercises.find(x=>x.id?x.id===e.id:x.name===e.name),t=x?.sets.find(s=>s.tester&&s.done&&!s.warm);return t?[{y:e.mode==='reps'?t.r:t.w,label:new Date(h.date).toLocaleDateString()+': '+t.w+' × '+t.r}]:[]}):[];return `<section><h3>${esc(data.plan[day][0])} progress</h3><p>${hs.length} sessions · ${hs.length?'Last duration '+fmt(hs.at(-1).duration):'No sessions yet'}</p><b>Workout duration (minutes)</b>${chart(hs.map(h=>({y:h.duration/60,label:fmt(h.duration)})),'Workout duration')}<label>Exercise<select onchange="chartExercise=Number(this.value);render()">${es.map((x,i)=>`<option value="${i}" ${x===e?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><b>${e?.mode==='reps'?'Tester reps':'Tester weight ('+esc(e?.unit||'lb')+')'}</b>${chart(ps,e?.mode==='reps'?'Tester reps':'Tester weight')}<small>Each dot is one logged session with a completed tester. Reps and weight are listed in history.</small></section>`}function deleteHistory(i){let h=data.history[i];if(!h)return;let latest=i===data.history.length-1;if(Object.values(data.drafts).some(d=>d.start))return alert('Finish or discard the active workout before deleting history.');if(!confirm(latest?(h.before?'Delete latest workout and restore its previous prescribed weights?':'Delete latest workout? This older record has no weight rollback snapshot; adjust weights manually if needed.'):'Delete this older workout? Current prescribed weights will remain unchanged.'))return;if(latest&&h.before){let es=data.plan.flatMap(p=>p[1]);for(let b of h.before){let e=es.find(e=>e.id===b.id);if(e&&e.sets.length===b.weights.length)e.sets.forEach((s,j)=>{s.w=b.weights[j];if(b.reps)s.r=b.reps[j]})}}data.history.splice(i,1);data.drafts={};data.day=nextDay();save();render()}function history(){return trends()+`<section><button onclick="backup()">Backup JSON</button> <button class="alt" onclick="csv()">Export CSV</button><p><label>Restore backup<input type="file" accept=".json" onchange="restore(this)"></label></p></section>`+(data.history.filter(h=>h.day===data.plan[day][0]).slice().reverse().map(h=>`<section><details open><summary>${esc(h.day)} · ${new Date(h.date).toLocaleDateString()} · ${fmt(h.duration)}</summary>${h.exercises.map(e=>`<p><b>${esc(e.name)}</b> · ${e.deload?(e.mode==='reps'?'Reduced reps':'Reduced weight'):e.delta?'+'+e.delta+(e.mode==='reps'?' reps':' lb'):'Maintain'}<br><small>${e.sets.filter(s=>s.done).map(s=>s.w+' × '+s.r+(s.tester?' (tester)':'')+(e.mode==='reps'&&s.nextReps!=null?' → '+s.nextReps+' reps':s.nextWeight!=null?' → '+s.nextWeight+' lb':'')).join(' / ')}</small></p>`).join('')}</details><button class="alt" onclick="openHistoryEdit(${data.history.indexOf(h)})">Edit workout</button> <button class="alt warn" onclick="deleteHistory(${data.history.indexOf(h)})">Delete workout</button></section>`).join('')||'<p>No workouts saved yet.</p>')}
function applyResults(plan,getRows,getWarm){let out=[];for(let e of plan){let rs=getRows(e),delta=progression(e,rs),full=e.sets.every((s,j)=>s.warm||rs[j].done),failed=full&&e.sets.some((s,j)=>!s.warm&&rs[j].r<s.r);let reduce=e.mode!=='none'&&failed&&failures(e)>=2;let step=e.unit==='lb per DB'?5:Math.max(0.5,e.a||2.5);let next=(s,r)=>{let base=s.w===''?r.w:s.w;return e.mode!=='weight'&&e.mode?base:reduce?Math.max(0,Math.floor(base*.95/step)*step):base+delta};if(!rs.some(r=>r.done))continue;let nextRep=s=>e.mode==='reps'?(reduce?Math.max(1,s.r-1):s.r+delta):s.r;out.push({id:e.id,name:e.name,unit:e.unit,mode:e.mode,delta,failed:failed&&!reduce,deload:reduce,sets:[...getWarm(e).filter(r=>r.done).map(r=>({...r,warm:true,tester:false,nextWeight:null})),...rs.map((r,j)=>({...r,target:e.sets[j].r,nextReps:e.sets[j].warm||!r.done?null:nextRep(e.sets[j]),nextWeight:e.sets[j].warm||!r.done?null:next(e.sets[j],r),warm:e.sets[j].warm,tester:j===e.tester}))]});e.sets.forEach((s,j)=>{if(!s.warm&&rs[j].done){s.w=next(s,rs[j]);s.r=nextRep(s)}})}return out;}
function saveNote(i,v){exercises()[i].notes=v;save()}
function alertSettings(){return `<section><b>Rest timer alerts</b><p><label><input style="width:auto;min-height:0;display:inline" type="checkbox" ${data.alertSound!==false?'checked':''} onchange="data.alertSound=this.checked;unlock();save()"> Sound</label> <label><input style="width:auto;min-height:0;display:inline" type="checkbox" ${data.alertVibration!==false?'checked':''} onchange="data.alertVibration=this.checked;save()"> Vibration</label></p><small>Alerts require the app to be running; iPhone vibration may not be supported.</small></section>`}
function summaryView(){let h=data.history.at(-1);if(!h)return '<p>No workout yet.</p>';let sets=h.exercises.flatMap(e=>e.sets).filter(s=>!s.warm);return `<section><h2>${esc(h.day)} complete</h2><p>${fmt(h.duration)} · ${sets.filter(s=>s.done).length}/${h.recipe?h.recipe.reduce((n,e)=>n+e.sets.filter(s=>!s.warm).length,0):sets.length} working sets</p>${h.exercises.map(e=>{let t=e.sets.find(s=>s.tester&&!s.warm),r=e.sets.filter(s=>s.done&&!s.warm);let reason=e.deload?'Three missed sessions':e.delta?'Tester threshold met':e.failed?'Target reps missed':r.length<e.sets.filter(s=>!s.warm).length?'Incomplete exercise':e.mode==='none'?'Progression disabled':'Progression threshold not met';return `<p><b>${esc(e.name)}</b><br>${e.deload?'Reduced':e.delta?'Increase':'Maintain'} · ${reason}<br><small>${r.map(s=>e.mode==='reps'?`${s.target} → ${s.nextReps} reps`:`${s.w} → ${s.nextWeight} lb`).join(' / ')}</small></p>`}).join('')}<p>Next recommended: ${esc(data.plan[nextDay()][0])}</p><button class="wide" onclick="selectTab('Workout')">Done</button></section>`}
let editIndex=-1,editCopy=null;
function openHistoryEdit(i){if(Object.values(data.drafts).some(d=>d.start))return alert('Finish or discard the active workout first.');editIndex=i;editCopy=JSON.parse(JSON.stringify(data.history[i]));tab='Edit history';render()}
function editHistoryView(){return `<section><h2>Edit ${esc(editCopy.day)}</h2><p><small>${editIndex===data.history.length-1&&editCopy.recipe?'Latest workout: progression will be recalculated if the current prescription still matches.':'Historical correction only; current prescription stays unchanged.'}</small></p>${editCopy.exercises.map((e,i)=>`<h3>${esc(e.name)}</h3>${e.sets.map((s,j)=>`<div class="set"><small>${j+1}${s.warm?' Warm':''}</small><input aria-label="Weight" type="number" min="0" step="any" value="${s.w}" onchange="historyValue(${i},${j},'w',this.value)"><input aria-label="Reps" type="number" min="0" value="${s.r}" onchange="historyValue(${i},${j},'r',this.value)"><label>Logged<input type="checkbox" ${s.done?'checked':''} onchange="editCopy.exercises[${i}].sets[${j}].done=this.checked"></label><span></span></div>`).join('')}`).join('')}<button onclick="saveHistoryEdit()">Save corrections</button> <button class="alt" onclick="selectTab('History')">Cancel</button></section>`}
function historyValue(i,j,k,v){editCopy.exercises[i].sets[j][k]=v===''?'':Number(v)}
function saveHistoryEdit(){if(editCopy.exercises.some(e=>e.sets.some(s=>s.done&&(!Number.isFinite(s.w)||s.w<0||!Number.isInteger(s.r)||s.r<0))))return alert('Enter valid weights and reps for logged sets.');let old=data.history[editIndex],latest=editIndex===data.history.length-1,plan=data.plan.flatMap(p=>p[1]);let safe=latest&&old.recipe&&old.recipe.every(e=>{let cur=plan.find(x=>x.id===e.id),h=old.exercises.find(x=>x.id===e.id);return cur&&cur.sets.length===e.sets.length&&cur.mode===e.mode&&cur.sets.every((s,j)=>{let r=h?.sets.filter(x=>!x.autoWarm).slice(-e.sets.length)[j];return s.w===(r?.nextWeight??e.sets[j].w)&&s.r===(r?.nextReps??e.sets[j].r)})});if(!confirm(safe?'Save corrections and recalculate progression?':'Save historical correction without changing current progression?'))return;if(safe){let recipe=JSON.parse(JSON.stringify(old.recipe));data.history.pop();let result=applyResults(recipe,e=>{let h=editCopy.exercises.find(x=>x.id===e.id);return h?h.sets.slice(-e.sets.length):e.sets.map(s=>({w:s.w,r:s.r,done:false}))},e=>{let h=editCopy.exercises.find(x=>x.id===e.id);return h?h.sets.slice(0,Math.max(0,h.sets.length-e.sets.length)):[]});editCopy.exercises=result;for(let e of recipe){let cur=plan.find(x=>x.id===e.id);e.sets.forEach((s,j)=>{cur.sets[j].w=s.w;cur.sets[j].r=s.r})}data.history.push(editCopy);data.drafts={}}else{editCopy.corrected=true;data.history[editIndex]=editCopy}save();tab='History';render()}
function selectTab(t){tab=t;if(t==='Workout'){let active=Object.keys(data.drafts).find(k=>data.drafts[k].start);if(active!==undefined)day=Number(active)}render()}function render(){$('days').innerHTML=data.plan.map((p,i)=>`<button class="${day===i?'':'alt'}" onclick="switchDay(${i})">${esc(p[0])}</button>`).join('');$('tabs').innerHTML=['Workout','Editor','History'].map(t=>`<button class="${tab===t?'':'alt'}" onclick="selectTab('${t}')">${t}</button>`).join('');let d=draft();$('clock').hidden=tab!=='Workout'||!d.start;$('clock').innerHTML=`<div class="line"><b>Workout time <span id="elapsed"></span></b><span id="workstatus"></span></div>${d.start?`<div class="line"><button class="alt" onclick="${d.pausedAt?'start();render()':'pause()'}">${d.pausedAt?'Resume':'Pause'}</button><button class="alt" onclick="finish()">Finish &amp; Save</button><button class="alt warn" onclick="discard()">Discard</button></div>`:''}<div class="line"><b>Rest timer: <span id="rest"></span></b></div><div class="line"><button class="alt" id="minus" onclick="adjust(-15)">−15s</button><button class="alt" id="plus" onclick="adjust(15)">+15s</button><button class="alt" id="skip" onclick="skipRest()">Skip</button></div>`;$('main').innerHTML=tab==='Workout'?workout():tab==='Editor'?editor():tab==='Summary'?summaryView():tab==='Edit history'?editHistoryView():history();tick()}async function checkUpdate(){try{if('serviceWorker'in navigator){let r=await navigator.serviceWorker.getRegistration();if(r)await r.update()}location.reload()}catch{alert('Connect to the internet and try again.')}}save();render();setInterval(tick,250);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{$('notice').textContent='Offline installation unavailable on this connection.'});
</script></body></html>
