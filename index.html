<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17212c"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>RepLedger</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#f2f4f6;color:#17212c;max-width:650px;margin:auto;padding:16px 12px 60px}section{background:white;border-radius:14px;padding:14px;margin:12px 0}button,input,select{font:inherit;border:1px solid #c5cbd2;border-radius:8px;padding:9px;min-height:42px}button{background:#17212c;color:white;cursor:pointer}button.alt{background:white;color:#17212c}input{width:100%;min-width:0}h1,h2,h3,p{margin:8px 0}small{color:#526171}nav,.line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0}nav button{flex:1}.set{display:grid;grid-template-columns:1.15fr 1fr 1fr 1fr auto;gap:5px;align-items:center;margin:6px 0}.done{background:#e2f3e7;border-radius:8px}#clock{position:sticky;top:0;background:#17212c;color:white;padding:10px;z-index:3;border-radius:10px}#clock button{min-height:32px;padding:4px 10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}label{font-size:13px}label input,label select{display:block;margin-top:3px}summary{cursor:pointer}button:disabled{opacity:.5}.warn{color:#a33}#notice{font-size:13px} .wide{width:100%}</style></head><body><h1>RepLedger</h1><small>Version 3.0 · Prescribed sets. Objective progression.</small><nav id="days"></nav><nav id="tabs"></nav><div id="clock"></div><p id="notice"></p><main id="main"></main><script>
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2);const make=(name,n,r,t,rest,a,b,lo=1,hi=2,unit='total lb')=>({id:uid(),name,tester:t-1,rest,a,b,lo,hi,unit,sets:Array.from({length:n},()=>({w:'',r,warm:false}))});
const defaults=()=>[['Day A',[make('Flat barbell bench press',4,8,2,150,2.5,5),make('Seated cable row',4,10,2,120,2.5,5),make('Hip thrust',3,10,2,120,5,10),make('Cable leg curl',3,12,3,90,2.5,5),make('DB lateral raise',3,15,3,60,5,5,4,5,'lb per DB'),make('Triceps pushdown',3,12,3,60,2.5,5)]],['Day B',[make('Front squat',3,8,2,180,5,10),make('Pull-ups',4,8,2,150,2.5,5,1,2,'added lb'),make('Smith RDL',3,10,2,180,2.5,5),make('Low-to-high cable fly',3,12,3,90,2.5,5),make('Cable biceps curl',4,12,4,90,2.5,5),make('Standing calf raise',3,15,3,90,2.5,5)]],['Day C',[make('20° incline barbell bench press',4,10,2,150,2.5,5),make('Lat pulldown',4,10,2,120,2.5,5),make('Bulgarian split squat',3,10,2,120,5,5,2,2,'lb per DB'),make('Cable lateral raise',3,15,3,90,2.5,5),make('Hammer curl',3,12,3,90,5,5,2,2,'lb per DB'),make('Kneeling cable crunch',3,15,3,60,2.5,5)]]];
let data={plan:defaults(),history:[],drafts:{},day:0};try{let x=JSON.parse(localStorage.getItem('repledger-v1'));if(x)data=x}catch{}function migrate(){data.schemaVersion=3;data.plan.forEach((p,i)=>p[0]='Day '+ 'ABC'[i]);data.history.forEach(h=>{h.day=({Sunday:'Day A',Tuesday:'Day B',Thursday:'Day C'})[h.day]||h.day})}migrate();let day=nextDay(),tab='Workout';const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function nextDay(){let active=Object.keys(data.drafts).find(k=>data.drafts[k].start);if(active!==undefined)return Number(active);let h=data.history.at(-1);return h?(data.plan.findIndex(p=>p[0]===h.day)+1)%3:0}function save(){try{localStorage.setItem('repledger-v1',JSON.stringify(data))}catch{$('notice').textContent='Storage unavailable. Export a backup before closing.'}}function draft(){return data.drafts[day]||(data.drafts[day]={start:0,rest:0,rows:{}})}function exercises(){return data.plan[day][1]}function rows(e){return draft().rows[e.id]||(draft().rows[e.id]=e.sets.map(s=>({w:s.w,r:s.r,done:false})))}function count(es){return es.reduce((n,e)=>n+e.sets.filter(s=>!s.warm).length,0)}function fmt(n){n=Math.max(0,Math.floor(n));return Math.floor(n/60)+':'+String(n%60).padStart(2,'0')}function tick(){let d=draft(),r=Math.max(0,Math.ceil((d.rest-Date.now())/1000));$('elapsed').textContent=fmt(d.start?(Date.now()-d.start)/1000:0);$('rest').textContent=fmt(r);if(d.rest&&r===0){d.rest=0;save();if(navigator.vibrate)navigator.vibrate(200);try{if(audio){let o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);g.gain.value=.08;o.start();o.stop(audio.currentTime+.25)}}catch{}}}let audio;function unlock(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();audio.resume()}catch{}}function adjust(n){unlock();draft().rest=Math.max(Date.now(),draft().rest)+n*1000;save();tick()}function start(){unlock();if(!draft().start)draft().start=Date.now();save();tick()}function setval(i,j,k,v){let e=exercises()[i],r=rows(e)[j];r[k]=v===''?'':Number(v);if(k==='w'&&j===0&&!e.sets[0].warm&&e.sets.every(s=>s.w===''))rows(e).forEach((x,k)=>{if(!x.done&&!e.sets[k].warm)x.w=r.w});save();if(k==='w'&&j===0){let sec=document.querySelectorAll('#main section')[i+2];if(sec)sec.querySelectorAll('input[aria-label=Weight]').forEach((el,k)=>{el.value=rows(e)[k].w})}}function log(i,j){let e=exercises()[i],r=rows(e)[j];if(r.done){r.done=false;save();render();return}if(r.w===''||!Number.isFinite(r.w)||r.w<0||!Number.isInteger(r.r)||r.r<0)return alert('Enter valid weight and reps. Use 0 for bodyweight.');start();r.done=true;draft().rest=Date.now()+e.rest*1000;save();render()}
function progression(e,rs){let t=e.sets[e.tester],x=rs[e.tester];if(!t||t.warm||!x||!e.sets.every((s,j)=>s.warm||(rs[j]?.done&&rs[j].r>=s.r&&(s.w===''||rs[j].w>=s.w))))return 0;let extra=x.r-t.r;return extra>=e.hi?e.b:extra>=e.lo?e.a:0}function failures(e){let hs=data.history.flatMap(h=>h.exercises.filter(x=>x.id===e.id));let n=0;for(let x of hs.reverse()){if(!x.failed)break;n++}return n}function finish(){let d=draft(),out=[];if(!exercises().some(e=>rows(e).some(r=>r.done)))return alert('Log a set first.');if(exercises().some(e=>e.sets.some((s,j)=>!s.warm&&!rows(e)[j].done))&&!confirm('Save incomplete workout? Incomplete exercises will not progress.'))return;for(let e of exercises()){let rs=rows(e),delta=progression(e,rs),full=e.sets.every((s,j)=>s.warm||rs[j].done),failed=full&&e.sets.some((s,j)=>!s.warm&&rs[j].r<s.r);let reduce=failed&&failures(e)>=2;let step=e.unit==='lb per DB'?5:Math.max(0.5,e.a||2.5);let next=(s,r)=>{let base=s.w===''?r.w:s.w;return reduce?Math.max(0,Math.floor(base*.95/step)*step):base+delta};if(!rs.some(r=>r.done))continue;out.push({id:e.id,name:e.name,unit:e.unit,delta,failed:failed&&!reduce,deload:reduce,sets:rs.map((r,j)=>({...r,target:e.sets[j].r,nextWeight:e.sets[j].warm||!r.done?null:next(e.sets[j],r),warm:e.sets[j].warm,tester:j===e.tester}))});e.sets.forEach((s,j)=>{if(!s.warm&&rs[j].done){s.w=next(s,rs[j])}})}data.history.push({date:new Date().toISOString(),day:data.plan[day][0],duration:d.start?Math.floor((Date.now()-d.start)/1000):0,exercises:out});delete data.drafts[day];day=nextDay();data.day=day;save();tab='Workout';render()}
function switchDay(i){chartExercise=0;day=i;data.day=i;save();render()}function editAllowed(){return !draft().start||confirm('Editing clears this day’s unsaved workout. Continue?')}function edit(i,k,v){if(!editAllowed()){render();return}let e=exercises()[i];e[k]=['name','unit'].includes(k)?v:Number(v);delete data.drafts[day];save();render()}function editSet(i,j,k,v){if(!editAllowed()){render();return}let e=exercises()[i];e.sets[j][k]=k==='warm'?v:v===''&&k==='w'?'':Math.max(k==='r'?1:0,Number(v)||0);if(e.sets[e.tester]?.warm)e.tester=e.sets.findIndex(s=>!s.warm);delete data.drafts[day];save();render()}function mutate(i,op,j){if(!editAllowed())return;let es=exercises(),e=es[i];if(op==='add')es.push(make('New exercise',3,10,3,90,2.5,5));if(op==='remove'&&confirm('Remove exercise?'))es.splice(i,1);if(op==='up'&&i>0)[es[i-1],es[i]]=[es[i],es[i-1]];if(op==='down'&&i<es.length-1)[es[i+1],es[i]]=[es[i],es[i+1]];if(op==='setadd')e.sets.push({w:'',r:10,warm:false});if(op==='setremove'&&e.sets.length>1){e.sets.splice(j,1);if(j<e.tester)e.tester--;else if(j===e.tester)e.tester=e.sets.findIndex(s=>!s.warm)}delete data.drafts[day];save();render()}
function moveLive(i,d){let es=exercises(),j=i+d;if(j<0||j>=es.length)return;[es[i],es[j]]=[es[j],es[i]];save();render()}function field(i,k,label,min=0){let e=exercises()[i];return `<label>${label}<input type="number" min="${min}" step="any" value="${e[k]}" onchange="if(this.checkValidity())edit(${i},'${k}',this.value)"></label>`}function editor(){return `<section><b>${count(exercises())} sets today · ${data.plan.reduce((n,p)=>n+count(p[1]),0)} / 60 weekly</b><p><small>Warm-ups excluded. Weights are editable per set.</small></p></section>`+exercises().map((e,i)=>`<section><label>Exercise name<input value="${esc(e.name)}" onchange="edit(${i},'name',this.value)"></label><div class="line"><button class="alt" onclick="mutate(${i},'up')">↑</button><button class="alt" onclick="mutate(${i},'down')">↓</button><button class="alt" onclick="mutate(${i},'remove')">Remove</button></div><div class="fields">${field(i,'rest','Rest seconds')}${field(i,'a','Small increase (lb)')}${field(i,'b','Large increase (lb)')}${field(i,'lo','Extra reps for small increase',1)}${field(i,'hi','Extra reps for large increase',1)}<label>Weight convention<input value="${esc(e.unit)}" onchange="edit(${i},'unit',this.value)"></label><label>Tester set<select onchange="edit(${i},'tester',this.value)"><option value="-1">None</option>${e.sets.map((s,j)=>s.warm?'':`<option value="${j}" ${j===e.tester?'selected':''}>Set ${j+1}</option>`).join('')}</select></label></div><div class="set"><small>Set</small><small>Weight</small><small>Reps</small><small>Warm-up</small><span></span></div>${e.sets.map((s,j)=>`<div class="set"><span>${j+1}</span><input aria-label="Weight" type="number" min="0" step="any" value="${s.w}" onchange="editSet(${i},${j},'w',this.value)"><input aria-label="Reps" type="number" min="1" value="${s.r}" onchange="editSet(${i},${j},'r',this.value)"><input aria-label="Warm-up" type="checkbox" ${s.warm?'checked':''} onchange="editSet(${i},${j},'warm',this.checked)"><button class="alt" onclick="mutate(${i},'setremove',${j})">×</button></div>`).join('')}<button class="alt" onclick="mutate(${i},'setadd')">Add set</button></section>`).join('')+`<button class="wide" onclick="mutate(0,'add')">Add exercise</button>`}
function home(){let h=data.history.at(-1),n=nextDay();return `<section><small>Recommended next workout</small><h2>${data.plan[n][0]}</h2><p>${h?'Last workout: '+esc(h.day)+' · '+new Date(h.date).toLocaleDateString()+' · '+fmt(h.duration):'No completed workouts yet'}</p>${data.plan.map(p=>{let x=data.history.filter(h=>h.day===p[0]).at(-1);return `<p><small>${p[0]}: ${x?new Date(x.date).toLocaleDateString():'Not yet completed'}</small></p>`}).join('')}<button onclick="switchDay(${n});start()">${data.drafts[n]?.start?'Resume':'Start'} ${data.plan[n][0]}</button></section>`}function previous(e){let x=data.history.slice().reverse().flatMap(h=>h.exercises).find(x=>x.id===e.id);return x?'<p><small>Previous: '+x.sets.filter(s=>s.done).map(s=>s.w+' × '+s.r).join(' / ')+'</small></p>':''}function workout(){return home()+ `<section><b>${count(exercises())} working sets</b><p><small>Enter starting weights on your first visit. Tester: stop at the upper target or earlier if form deteriorates. For unilateral lifts, log reps on the weaker side.</small></p></section>`+exercises().map((e,i)=>{let rs=rows(e);return `<section><h3>${i+1}. ${esc(e.name)}</h3>${previous(e)}<div class="line"><button class="alt" onclick="moveLive(${i},-1)">↑</button><button class="alt" onclick="moveLive(${i},1)">↓</button></div><small>${esc(e.unit)} · Rest ${fmt(e.rest)}</small><div class="set"><small>Set</small><small>Weight</small><small>Target</small><small>Actual</small><span></span></div>${e.sets.map((s,j)=>`<div class="set ${rs[j].done?'done':''}"><small>${j+1}${s.warm?' Warm':j===e.tester?' Test':''}</small><input aria-label="Weight" type="number" min="0" step="any" placeholder="lb" value="${rs[j].w}" onchange="setval(${i},${j},'w',this.value)" ${rs[j].done?'disabled':''}><span>${s.r}${j===e.tester&&!s.warm?'–'+(s.r+Math.max(e.lo,e.hi)):''}</span><input aria-label="Actual reps" type="number" min="0" value="${rs[j].r}" onchange="setval(${i},${j},'r',this.value)" ${rs[j].done?'disabled':''}><button onclick="log(${i},${j})">${rs[j].done?'✓':'Log'}</button></div>`).join('')}<small>${rs.every((r,j)=>e.sets[j].warm||r.done)?'Next session: '+(progression(e,rs)?'+'+progression(e,rs)+' lb':'maintain'):'Progression calculated after all working sets.'}</small></section>`}).join('')+`<button class="wide" onclick="finish()">Finish & save workout</button>`}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backup(){download('repledger-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data),'application/json')}function csv(){let q=x=>'"'+String(x).replaceAll('"','""')+'"';download('repledger-history.csv','Date,Day,Duration_seconds,Exercise,Set,Weight,Reps,Target,Warmup,Tester,Logged,Increase,Next_weight\n'+data.history.flatMap(h=>h.exercises.flatMap(e=>e.sets.map((s,j)=>[h.date,h.day,h.duration,e.name,j+1,s.w,s.r,s.target,s.warm,s.tester,s.done,e.delta,s.nextWeight??''].map(q).join(',')))).join('\n'),'text/csv')}async function restore(el){try{let x=JSON.parse(await el.files[0].text());if((x.schemaVersion||1)>3||!Array.isArray(x.plan)||x.plan.length!==3||!Array.isArray(x.history)||!x.drafts||!x.plan.every(p=>Array.isArray(p[1])&&p[1].every(e=>Array.isArray(e.sets)&&e.id&&typeof e.name==='string'&&e.sets.every(s=>Number.isInteger(s.r)&&s.r>0&&(s.w===''||Number.isFinite(s.w))))))throw Error();if(!x.history.every(h=>Array.isArray(h.exercises)&&h.exercises.every(e=>Array.isArray(e.sets))))throw Error();if(confirm('Replace current program and history? Export your current backup first if needed.')){data=x;migrate();day=nextDay();save();render()}}catch{alert('Invalid RepLedger backup.')}}let chartExercise=0;function chart(points,label){if(!points.length)return '<p><small>No data yet.</small></p>';let ys=points.map(p=>p.y),lo=Math.min(...ys),hi=Math.max(...ys);if(lo===hi){lo-=1;hi+=1}let coords=points.map((p,i)=>[40+(points.length===1?130:i*260/(points.length-1)),105-(p.y-lo)/(hi-lo)*80]);return `<svg viewBox="0 0 340 130" style="width:100%;max-height:180px" role="img" aria-label="${esc(label)}"><text x="2" y="20" font-size="10">${hi.toFixed(1)}</text><text x="2" y="110" font-size="10">${lo.toFixed(1)}</text><path d="M40 15 V105 H300" fill="none" stroke="#bbb"/><polyline points="${coords.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#3270a5" stroke-width="2"/>${coords.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#3270a5"><title>${esc(points[i].label)}</title></circle>`).join('')}<text x="40" y="125" font-size="10">Session 1</text><text x="300" y="125" text-anchor="end" font-size="10">${points.length}</text></svg>`}function trends(){let hs=data.history.filter(h=>h.day===data.plan[day][0]),es=exercises(),e=es[chartExercise]||es[0];let ps=e?hs.flatMap(h=>{let x=h.exercises.find(x=>x.id?x.id===e.id:x.name===e.name),t=x?.sets.find(s=>s.tester&&s.done&&!s.warm);return t?[{y:t.w,label:new Date(h.date).toLocaleDateString()+': '+t.w+' × '+t.r}]:[]}):[];return `<section><h3>${esc(data.plan[day][0])} progress</h3><p>${hs.length} sessions · ${hs.length?'Last duration '+fmt(hs.at(-1).duration):'No sessions yet'}</p><b>Workout duration (minutes)</b>${chart(hs.map(h=>({y:h.duration/60,label:fmt(h.duration)})),'Workout duration')}<label>Exercise<select onchange="chartExercise=Number(this.value);render()">${es.map((x,i)=>`<option value="${i}" ${x===e?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label><b>Tester weight (${esc(e?.unit||'lb')})</b>${chart(ps,'Tester weight')}<small>Each dot is one logged session with a completed tester. Reps and weight are listed in history.</small></section>`}function history(){return trends()+`<section><button onclick="backup()">Backup JSON</button> <button class="alt" onclick="csv()">Export CSV</button><p><label>Restore backup<input type="file" accept=".json" onchange="restore(this)"></label></p></section>`+(data.history.filter(h=>h.day===data.plan[day][0]).slice().reverse().map(h=>`<section><details open><summary>${esc(h.day)} · ${new Date(h.date).toLocaleDateString()} · ${fmt(h.duration)}</summary>${h.exercises.map(e=>`<p><b>${esc(e.name)}</b> · ${e.deload?'Reduced weight':e.delta?'+'+e.delta+' lb':'Maintain'}<br><small>${e.sets.filter(s=>s.done).map(s=>s.w+' × '+s.r+(s.tester?' (tester)':'')+(s.nextWeight!=null?' → '+s.nextWeight+' lb':'')).join(' / ')}</small></p>`).join('')}</details></section>`).join('')||'<p>No workouts saved yet.</p>')}
function render(){$('days').innerHTML=data.plan.map((p,i)=>`<button class="${day===i?'':'alt'}" onclick="switchDay(${i})">${esc(p[0])}</button>`).join('');$('tabs').innerHTML=['Workout','Editor','History'].map(t=>`<button class="${tab===t?'':'alt'}" onclick="tab='${t}';render()">${t}</button>`).join('');$('clock').innerHTML='<div class="line"><b>Workout <span id="elapsed"></span> / 70:00</b><b>Rest <span id="rest"></span></b></div><div class="line"><button class="alt" onclick="start()">Start</button><button class="alt" onclick="adjust(-15)">−15s</button><button class="alt" onclick="adjust(15)">+15s</button><button class="alt" onclick="draft().rest=0;save();tick()">Skip</button></div>';$('main').innerHTML=tab==='Workout'?workout():tab==='Editor'?editor():history();tick()}render();setInterval(tick,250);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{$('notice').textContent='Offline installation unavailable on this connection.'});
</script></body></html>
